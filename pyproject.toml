[project]
name = "provisioning-service"
version = "0.1.0"
description = "FileEngine provisioning: stand up project spaces (folders + ACL + metadata + automation + tenant-scoped resources) from an inline blueprint, for embedding integrations"
license = {text = "AGPL-3.0-or-later"}
authors = [{name = "James Hickman", email = "james@rationalboxes.com"}]
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.30",
    "ldap3>=2.9",
    "grpcio>=1.50",
    "protobuf>=4.21",
    "psycopg[binary]>=3.1",
    "redis>=5.0",
    "pydantic>=2.0",
    "httpx>=0.27",           # folder_actions orchestration (:8099)
    "PyJWT>=2.8",            # local HS256 bridge-token verify
]
# The FileEngine Python client (`fileengine`, from ../python_interface) is reused at
# runtime for gRPC core access; install it (`pip install ../python_interface`) or rely
# on the sibling-checkout bootstrap in provisioning_service._client.

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov>=4.0"]

[project.scripts]
provisioning-service = "provisioning_service.app:main"                 # REST API (:8100)
provisioning-service-reconcile = "provisioning_service.reconcile:main"  # optional drift sweep

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
